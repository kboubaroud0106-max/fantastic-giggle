{% extends "base.html" %}

{% block title %}Connexion - Administration{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div class="glass-card" style="width: 100%; max-width: 400px; margin-bottom: 0;">
        <h3 class="card-title" style="text-align: center; margin-bottom: 1.5rem;">Espace Administration</h3>
        
        {% if error %}
            <div style="background-color: #fee2e2; border: 1px solid #fecaca; color: var(--danger); padding: 0.75rem; border-radius: 8px; margin-bottom: 1.25rem; font-size: 0.9rem; font-weight: 500;">
                {{ error }}
            </div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('admin_login') }}">
            <div class="form-group">
                <label for="username" class="form-label">Identifiant :</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="admin" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Mot de passe :</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Se connecter</button>
        </form>
        
        <div style="text-align: center; margin-top: 1.25rem; font-size: 0.8rem; color: var(--text-muted);">
            Pour un premier lancement, l'identifiant est <strong>admin</strong> et le mot de passe est <strong>adminSafi2026</strong>.
        </div>
    </div>
</div>
{% endblock %}
